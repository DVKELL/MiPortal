<!-- 
  Guía Completa de Administración y Edición
  1. Cómo modificar el titulo:
    Edita el texto que se encuentra dentro de la etiqueta <h1 class="main-title">...</h1> 
    
  2. Cómo editar el parrafo
    Edita el texto que se encuentra dentro de la etiqueta <p class="description">...</p> 
-->

<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8" />
    <!-- Carga de Fuentes de Google e Iconos de Material -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />

    <!-- Estilos CSS Nativos -->
    <style>
      :root {
        --brand-yellow: #ffd200;
        --brand-dark: #111827;
        --brand-textSecondary: #64748b;
        --brand-border: #e5e7eb;
      }

      * {
        margin: 0;
      }

      /* Reinicio básico y tipografía */
      .embed-wrapper-1 {
        font-family: "Inter", sans-serif;
        color: var(--brand-dark);
        box-sizing: border-box;
      }

      /* Contenedor Principal del Encabezado */
      .header-container {
        max-width: 48rem;
        margin: 0 auto;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* Etiqueta Superior (Eyebrow) */
      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.375rem 0.875rem;
        background-color: #fffbeb;
        border: 1px solid #fde68a;
        color: #78350f;
        border-radius: 9999px;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.025em;
        text-transform: uppercase;
        margin-bottom: 1rem;
      }

      .eyebrow .material-symbols-outlined {
        font-size: 0.875rem;
        color: var(--brand-yellow);
      }

      /* Título Principal */
      .main-title {
        font-size: 48px;
        font-weight: 700;
        letter-spacing: -0.025em;
        color: var(--brand-dark);
        margin: 0 0 1rem 0;
        line-height: 1.2;
      }

      @media (min-width: 640px) {
        .main-title {
          font-size: 48px;
        }
      }

      .title-highlight {
        position: relative;
        display: inline-block;
        color: var(--brand-dark);
        z-index: 1;
      }

      .title-highlight::after {
        content: "";
        position: absolute;
        bottom: -6px;
        left: 0;
        width: 100%;
        height: 4px;
        background-color: var(--brand-yellow);
        z-index: -1;
      }

      /* Descripción */
      .description {
        font-size: 1rem;
        color: var(--brand-textSecondary);
        line-height: 1.625;
        margin: 0;
      }

      @media (min-width: 640px) {
        .description {
          font-size: 1.125rem;
        }
      }
    </style>
  </head>

  <body>
    <div class="embed-wrapper-1">
      <header class="header-container">
        <div class="eyebrow">
          <!-- Texto antes del titulo -->
          <span class="material-symbols-outlined">military_tech</span>
          Cultura & Talento Operativo
        </div>

        <!-- ============ TITULO ============ -->
        <h1 class="main-title">
          Historias <span class="title-highlight">WOW!</span>
        </h1>

        <p class="description">
          Relatos reales de esfuerzo, precisión técnica y vocación de servicio.
          Conoce las gestiones sobresalientes de nuestro equipo operativo que
          elevan el estándar de excelencia en cada turno.
        </p>
      </header>
    </div>
  </body>
</html>
