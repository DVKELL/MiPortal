<!-- IMPORTANTE
  Guía de edición rápida para el equipo

    Imagen de fondo (<img>): Cambia el enlace dentro de src="..." por la URL de la imagen principal.
    <img
      class="hero-bg-img"
      src="NUEVA URL AQUI"
      alt="Fondo MiPortal"
    />

    Texto alternativo (alt="..."): Describe brevemente la imagen.

    Título Principal: Modifica el texto entre <h1 class="hero-title">...</h1>.

    Descripción: Ajusta el mensaje dentro de <p class="hero-description">...</p>.
-->

<html>
  <head>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --font-family: "Inter", sans-serif;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: var(--font-family), sans-serif;
      }

      body {
        background: transparent;
      }

      /* Banner principal */
      .hero-section {
        position: relative;
        background: linear-gradient(
          135deg,
          rgba(25, 28, 29, 1) 0%,
          rgba(46, 49, 50, 1) 100%
        );
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);

        /* Más compacto */
        min-height: 150px;
        display: flex;
        align-items: center;
        padding: 28px 36px;
      }

      /* Oscurecimiento para facilitar lectura */
      .hero-overlay {
        position: absolute;
        inset: 0;
        background-color: rgba(0, 0, 0, 0.4);
        z-index: 10;
      }

      /* Imagen de fondo */
      .hero-bg-img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 0;
        opacity: 0.6;
      }

      /* Contenedor del texto */
      .hero-content {
        position: relative;
        z-index: 20;
        max-width: 650px;
        color: #ffffff;
      }

      .hero-title {
        font-size: 30px;
        line-height: 42px;
        letter-spacing: -0.02em;
        font-weight: 700;
        margin-bottom: 10px;
      }

      .hero-description {
        font-size: 15px;
        line-height: 24px;
        color: #d9dadb;
        margin-bottom: 0;
      }

      /* Adaptación móvil */
      @media (max-width: 768px) {
        .hero-section {
          min-height: 180px;
          padding: 24px;
        }

        .hero-title {
          font-size: 28px;
          line-height: 34px;
        }

        .hero-description {
          font-size: 15px;
          line-height: 22px;
        }
      }
    </style>
  </head>

  <section class="hero-section">
    <div class="hero-overlay"></div>

    <img
      class="hero-bg-img"
      src="https://lh3.googleusercontent.com/aida-public/AB6AXuDLzfceLE1xE-6PM6PgQXgcSbASb6ZbDkohUcnXL-v6EW2wDUeT7RrcmAISEYiN_kfmYsjN9x_79llQUhXGNFriN_px6M37kM--KEuvn5pS5HN-0_O1G4MDYfeSWnCKumLS16DqxB-Ri5EEU0_jRfT4zeM3y3SaKqNNu-LknYz179iWs8X9oCsDQMHSMVPH8upC7Wiiqkgam8irRTElf52x8j0OftHbfNCmOQEcT6FhN0rXIi4EVj0W"
      alt="Fondo MiPortal"
    />

    <div class="hero-content">
      <h1 class="hero-title">Bienvenido MiPortal Corporativo</h1>

      <p class="hero-description">
        Su portal central para noticias corporativas, herramientas diarias y
        recursos esenciales de la empesa.
      </p>
    </div>
  </section>
</html>
